max_steps = 50
seq_len = 2048
max_async_level = 1

[deployment]
type = "single_node"
num_train_gpus = 2
num_infer_gpus = 6

[wandb]
project = "baseline"
name = "model_seq_len_9216"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
batch_size = 512
rollouts_per_example = 16
max_concurrent = 96

[orchestrator.model.lora]
name = "model_seq_len_9216"

[orchestrator.sampling]
max_tokens = 1024
temperature = 1.0

[[orchestrator.env]]
id = "medqa"
name = "medqa"
args = { use_think = true, train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

[[orchestrator.env]]
id = "med_mcqa"
name = "med_mcqa"
args = { use_think = true, train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

[[orchestrator.env]]
id = "pubmedqa"
name = "pubmedqa"
args = { use_think = true, train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

#[[orchestrator.env]] not available at time. 
#id = "medcalc-bench"

[orchestrator.buffer]
env_ratios = [1, 1, 1] #, 1 [0.18, 0.593, 0.071, 0.156]
online_difficulty_filtering = true
easy_threshold = 0.8
hard_threshold = 0.2
easy_fraction = 0.0
hard_fraction = 0.0

[orchestrator.ckpt]

[orchestrator.val]
interval = 25
num_examples = 1410
rollouts_per_example = 1

[orchestrator.eval]
interval = 50
rollouts_per_example = 1 #maybe increase for less variance

[orchestrator.eval.sampling]
seed = 42
temperature = 0.0 #um, what?!? this doesn't seem right

[[orchestrator.eval.env]]
id = "medqa"

[[orchestrator.eval.env]]
id = "med_mcqa"

[[orchestrator.eval.env]]
id = "pubmedqa"

[trainer.model]
impl = "auto"
attn = "flash_attention_3"
seq_len = 9216 # ~max with ac freq 2

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.model.compile]

[trainer.model.lora]
alpha = 64 #maybe double?
rank = 64 #based on results from notion. April 1 2026 

[trainer.ckpt.weights]
save_adapter_separately = true #required for https://github.com/PrimeIntellect-ai/prime-rl/issues/1707

[trainer.optim]
lr = 1e-6
max_norm = 0.01 #is this a good idea?

[ckpt]
interval = 50
keep_last = 1

[inference]
enable_lora = true
gpu_memory_utilization = 0.9

[inference.parallel]
tp = 1
dp = 6

[inference.model]
max_model_len = 2048
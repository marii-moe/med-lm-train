max_steps = 5
seq_len = 2048
max_async_level = 1

[deployment]
type = "single_node"
num_train_gpus = 2
num_infer_gpus = 6

[wandb]
project = "baseline"
name = "token_batch_size_optim_offload_seqlen_12288"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
token_batch_size = 524288
rollouts_per_example = 16
max_inflight_rollouts = 512
max_concurrent = 96

[orchestrator.model.lora]
name = "token_batch_size_optim_offload_seqlen_12288"

[orchestrator.sampling]
max_tokens = 1024
temperature = 1.0

[[orchestrator.env]]
id = "medqa"
name = "medqa"
args = { train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

[[orchestrator.env]]
id = "med_mcqa"
name = "med_mcqa"
args = { train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

[[orchestrator.env]]
id = "pubmedqa"
name = "pubmedqa"
args = { train_answer_formats = "random", training_shuffle_answers = true, training_seed = 23 }

#[[orchestrator.env]] not available at time.
#id = "medcalc-bench"

[orchestrator.buffer]
env_ratios = [4, 19, 21]
online_difficulty_filtering = true
easy_threshold = 0.8
hard_threshold = 0.2
easy_fraction = 0.0
hard_fraction = 0.0

[trainer.model]
impl = "auto"
attn = "flash_attention_3"
seq_len = 12288
optim_cpu_offload = true

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.model.compile]

[trainer.model.lora]
alpha = 64
rank = 64

#[trainer.ckpt.weights]
#save_adapter_separately = true #required for https://github.com/PrimeIntellect-ai/prime-rl/issues/1707

[trainer.optim]
lr = 1e-6
max_norm = 0.01

[inference]
enable_lora = true
gpu_memory_utilization = 0.9

[inference.parallel]
tp = 1
dp = 6

[inference.model]
max_model_len = 2048


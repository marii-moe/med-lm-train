# Skywork OR1 Stage 1 reproduction (arXiv:2505.22312) — full fine-tune
# Stage 1: 8K context, ~540 steps, then continue to stage2 (16K) and stage3 (32K)
# Key deviations from paper: no adaptive entropy coefficient (not supported in PRIME-RL default loss).
max_steps = 660
seq_len = 8192
max_async_level = 1

[deployment]
type = "single_node"
num_train_gpus = 2
num_infer_gpus = 2

[wandb]
project = "math"
name = "skywork_or1_stage1_full"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"

[orchestrator]
token_batch_size = 1572864 # ~avg seq length 6144 * bs 256, baseline=524288
rollouts_per_example = 16  # group size M=16 from paper
max_inflight_rollouts = 256
max_concurrent = 96

[orchestrator.sampling]
max_tokens = 8192
temperature = 1.0  # τ=1.0 from paper

[[orchestrator.env]]
id = "math-env"
name = "skywork-or1"
args = { dataset_name = "PrimeIntellect/Skywork-OR1-RL-Data", dataset_subset = "default", difficulty_key = "difficulty_deepseek_r1_qwen_7b", min_avg_reward = 1, max_avg_reward = 15, math_verify_max_workers = 128, math_verify_timeout = 60 }
# difficulty_deepseek_r1_qwen_7b is a count of correct rollouts out of 16 (range 0-16).
# Filtering to 1-15 removes problems the 7B model never solves (zero gradient signal)
# and those it always solves (zero advantage), matching the paper's offline difficulty filtering.

[orchestrator.buffer]
# Paper filters out zero-advantage groups (all-correct or all-incorrect).
# easy/hard_fraction=0.0 achieves this by discarding those samples entirely.
online_difficulty_filtering = true
easy_threshold = 0.8
hard_threshold = 0.2
easy_fraction = 0.0
hard_fraction = 0.0

[orchestrator.val]
interval = 50
num_examples = 512
rollouts_per_example = 8

[orchestrator.eval]
interval = 100
rollouts_per_example = 1
eval_base_model = true

[orchestrator.eval.sampling]
seed = 42
temperature = 0.0

[[orchestrator.eval.env]]
id = "primeintellect/math500"

[[orchestrator.eval.env]]
id = "primeintellect/aime2024"
rollouts_per_example = 32

[[orchestrator.eval.env]]
id = "primeintellect/aime2025"
rollouts_per_example = 32

[[orchestrator.eval.env]]
id = "primeintellect/aime2026"
rollouts_per_example = 32

[trainer.model]
impl = "auto"
attn = "flash_attention_3"
seq_len = 9216
optim_cpu_offload = true

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.model.compile]

[trainer.loss]
type = "default"
kl_tau = 0.0    # paper explicitly removes KL penalty; finds it hurts multi-stage training
adv_tau = 1.0
ipo_mask_low = 0.2
ipo_mask_high = 0.2

[trainer.optim]
lr = 1e-6    # from Skywork OR1 repo (actor_rollout_ref.actor.optim.lr=1e-6)
max_norm = 1.0

[inference]
enable_lora = false
gpu_memory_utilization = 0.9

[inference.parallel]
tp = 1
dp = 4

[inference.model]
max_model_len = 8192

[ckpt]
interval = 50
keep_last = 1

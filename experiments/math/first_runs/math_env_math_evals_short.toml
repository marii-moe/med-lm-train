max_steps = 1000
seq_len = 2048
max_async_level = 1

[deployment]
type = "single_node"
num_train_gpus = 2
num_infer_gpus = 2

[wandb]
project = "math"
name = "math_env_math_evals_short"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
token_batch_size = 524288
rollouts_per_example = 16
max_inflight_rollouts = 512
max_concurrent = 96

[orchestrator.model.lora]
name = "math_env_math_evals_short"

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0

[[orchestrator.env]]
id = "primeintellect/math-env"
name = "math-env"
args = { use_think = false }

[orchestrator.buffer]
online_difficulty_filtering = true
easy_threshold = 0.8
hard_threshold = 0.2
easy_fraction = 0.0
hard_fraction = 0.0

[orchestrator.val]
interval = 50
num_examples = 512
rollouts_per_example = 8

[orchestrator.eval]
interval = 200
rollouts_per_example = 1
eval_base_model = true

[orchestrator.eval.sampling]
seed = 42
temperature = 0.0

[[orchestrator.eval.env]]
id = "primeintellect/math500"

[[orchestrator.eval.env]]
id = "primeintellect/aime2024"
rollouts_per_example = 32

[[orchestrator.eval.env]]
id = "primeintellect/aime2025"
rollouts_per_example = 32

[[orchestrator.eval.env]]
id = "primeintellect/aime2026"
rollouts_per_example = 32

[trainer.model]
impl = "auto"
attn = "flash_attention_3"
seq_len = 9216

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.model.compile]

[trainer.model.lora]
alpha = 64
rank = 64

[trainer.ckpt.weights]
save_adapter_separately = true #required for https://github.com/PrimeIntellect-ai/prime-rl/issues/1707

[trainer.optim]
lr = 5e-6
max_norm = 1.0

[trainer.scheduler]
type = "linear"
warmup_steps = 100
decay_steps = 0

[inference]
enable_lora = true
gpu_memory_utilization = 0.9

[inference.parallel]
tp = 1
dp = 4

[inference.model]
max_model_len = 2048

[ckpt]
interval = 50
keep_last = 1
